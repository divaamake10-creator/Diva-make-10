<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Base - Diva Make 10</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f8;
    color: #333;
}

/* TOPO */

.topo {
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    text-align: center;
    padding: 35px 10px;
    font-size: 32px;
    font-weight: bold;
}

/* CABEÇALHO */

.cabecalho {
    background: white;
    text-align: center;
    padding: 65px 20px;
}

.cabecalho h1 {
    color: #d0276b;
    font-size: 50px;
    margin-bottom: 25px;
}

.cabecalho p {
    color: #777;
    font-size: 24px;
}

/* ÁREA PRINCIPAL */

.principal {
    padding: 50px 25px;
    min-height: 500px;
}

/* BOTÃO VOLTAR */

.voltar {
    display: inline-block;
    background: #cc2870;
    color: white;
    padding: 18px 40px;
    border-radius: 40px;
    text-decoration: none;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 80px;
}

/* TÍTULO DOS PRODUTOS */

.produtos-titulo {
    text-align: center;
    color: #c92b6d;
    font-size: 48px;
    margin-bottom: 50px;
}

/* RODAPÉ */

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 50px 20px;
    margin-top: 30px;
}

footer h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

footer p {
    font-size: 22px;
}

</style>
</head>

<body>

<!-- TOPO -->

<div class="topo">
    💄 DIVA MAKE 10 💗
</div>

<!-- CABEÇALHO -->

<div class="cabecalho">

    <h1>💄 BASE</h1>

    <p>Confira nossas Bases disponíveis</p>

</div>

<!-- CONTEÚDO -->

<div class="principal">

    <a href="index.html" class="voltar">
        ← Voltar
    </a>

    <h2 class="produtos-titulo">
        💄 Nossas Bases
    </h2>

</div>

<!-- RODAPÉ -->

<footer>

    <h2>DIVA MAKE 10 💗</h2>

    <p>
        Beleza, variedade e preço incrível!
    </p>

</footer>

</body>
</html>
