<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gloss Labial - Diva Make 10</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f8;
    color: #333;
}

.topo {
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    text-align: center;
    padding: 15px;
    font-weight: bold;
}

.topo h1 {
    font-size: 32px;
}

header {
    background: white;
    text-align: center;
    padding: 25px 15px;
    border-bottom: 2px solid #f3c0d5;
}

header h1 {
    color: #e60073;
    font-size: 30px;
}

header p {
    color: #777;
    margin-top: 8px;
}

.voltar {
    display: inline-block;
    margin: 20px;
    background: #e60073;
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
}

.titulo {
    text-align: center;
    color: #d90068;
    margin: 10px 0 25px;
}

.produtos {
    padding: 15px;
}

.lista-produtos {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
}

.produto {
    background: white;
    border: 2px solid #f7c4da;
    border-radius: 25px;
    padding: 25px;
    max-width: 350px;
    margin: 0 auto;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.produto h3 {
    color: #c92b6d;
    font-size: 28px;
    margin-bottom: 15px;
}

.produto-preco {
    color: #d0276b;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 20px;
}

.controle-quantidade {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 20px 0;
}

.controle-quantidade button {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #e52d7b;
    color: white;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}

.controle-quantidade span {
    font-size: 28px;
    font-weight: bold;
    color: #c92b6d;
    min-width: 35px;
    text-align: center;
}

.botao-carrinho {
    border: none;
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    padding: 16px 25px;
    border-radius: 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    margin-top: 100px;
    background: #222;
    color: white;
    text-align: center;
    padding: 25px;
}
</style>
</head>

<body>

<div class="topo">
    <h1>💄 DIVA MAKE 10 🩷</h1>
</div>

<header>
    <h1>💋 GLOSS LABIAL</h1>
    <p>Confira nossos Gloss Labiais disponíveis</p>
</header>

<a href="index.html" class="voltar">← Voltar</a>

<section class="produtos">

    <h2 class="titulo">💋 Nossos Gloss Labiais</h2>

    <div class="lista-produtos">

        <div class="produto">

            <h3>💋 Gloss Labial</h3>

            <div class="produto-preco">
                R$ 10,00
            </div>

            <div class="controle-quantidade">

                <button onclick="alterarQuantidadeProduto(-1)">
                    −
                </button>

                <span id="quantidadeProduto">1</span>

                <button onclick="alterarQuantidadeProduto(1)">
                    +
                </button>

            </div>

            <button class="botao-carrinho"
                onclick="adicionarAoCarrinho('Gloss Labial', 10)">
                🛒 Adicionar ao carrinho
            </button>

        </div>

    </div>

</section>

<script>

let quantidadeProduto = 1;

function alterarQuantidadeProduto(valor) {

    quantidadeProduto += valor;

    if (quantidadeProduto < 1) {
        quantidadeProduto = 1;
    }

    document.getElementById("quantidadeProduto").textContent =
        quantidadeProduto;
}

function adicionarAoCarrinho(nome, preco) {

    let carrinho =
        JSON.parse(localStorage.getItem("carrinho")) || [];

    const produtoExistente =
        carrinho.find(produto => produto.nome === nome);

    if (produtoExistente) {

        produtoExistente.quantidade += quantidadeProduto;

    } else {

        carrinho.push({
            nome: nome,
            preco: preco,
            quantidade: quantidadeProduto
        });

    }

    localStorage.setItem(
        "carrinho",
        JSON.stringify(carrinho)
    );

    alert("💗 Produto adicionado ao carrinho!");

    quantidadeProduto = 1;

    document.getElementById("quantidadeProduto").textContent = 1;
}

</script>

<footer>
    <h3>DIVA MAKE 10 🩷</h3>
    <p>Beleza, variedade e preço incrível!</p>
</footer>

</body>
</html>
