<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cola para Cílios - Diva Make 10</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f8;
    color: #333;
}

.topo {
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    text-align: center;
    padding: 20px 10px;
    font-size: 32px;
    font-weight: bold;
}

.cabecalho {
    background: white;
    text-align: center;
    padding: 40px 20px;
}

.cabecalho h1 {
    color: #d0276b;
    font-size: 40px;
    margin-bottom: 15px;
}

.cabecalho p {
    color: #777;
    font-size: 20px;
}

.principal {
    padding: 30px 20px;
    min-height: 500px;
}

.voltar {
    display: inline-block;
    background: #e60073;
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 30px;
}

.produtos-titulo {
    text-align: center;
    color: #c92b6d;
    font-size: 32px;
    margin-bottom: 30px;
}

.lista-produtos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.produto {
    background: white;
    max-width: 350px;
    width: 100%;
    margin: 0 auto;
    padding: 25px;
    border-radius: 25px;
    border: 2px solid #f7c4da;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    text-align: center;
}

.produto img {
    width: 100%;
    max-height: 200px;
    object-fit: contain;
    border-radius: 10px;
    margin-bottom: 15px;
}

.produto h3 {
    color: #d0276b;
    font-size: 26px;
    margin-bottom: 15px;
}

.produto-preco {
    color: #c92b6d;
    font-size: 26px;
    font-weight: bold;
}

.controle-quantidade {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 25px 0;
}

.controle-quantidade button {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #e52d7b;
    color: white;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}

.controle-quantidade span {
    font-size: 28px;
    font-weight: bold;
    color: #c92b6d;
    min-width: 35px;
    text-align: center;
}

.botao-carrinho {
    background: linear-gradient(135deg, #ff4b9b, #d90068);
    color: white;
    border: none;
    padding: 15px 20px;
    border-radius: 35px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.mensagem {
    text-align: center;
    padding: 30px;
    grid-column: 1 / -1;
}

footer {
    background: #e60073;
    color: white;
    text-align: center;
    padding: 40px 20px;
    margin-top: 30px;
}

footer h2 {
    font-size: 28px;
    margin-bottom: 15px;
}

footer p {
    font-size: 18px;
}

@media (max-width: 600px) {

    .lista-produtos {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<div class="topo">

    💄 DIVA MAKE 10 💗

</div>


<div class="cabecalho">

    <h1>👁️ COLA PARA CÍLIOS</h1>

    <p>
        Confira nossas Colas para Cílios disponíveis
    </p>

</div>


<div class="principal">


    <a
        href="index.html"
        class="voltar"
    >

        ← Voltar

    </a>


    <h2 class="produtos-titulo">

        👁️ Nossas Colas para Cílios

    </h2>


    <div
        id="lista-colas"
        class="lista-produtos"
    >

        <div class="mensagem">

            Carregando Colas para Cílios... 💗

        </div>

    </div>


</div>


<footer>

    <h2>DIVA MAKE 10 💗</h2>

    <p>
        Beleza, variedade e preço incrível!
    </p>

</footer>


<script>

const API_PRODUTOS =
    "https://diva-make-10.vercel.app/api/produtos";


let produtosDaLoja = [];


async function carregarColas() {

    const lista =
        document.getElementById(
            "lista-colas"
        );


    try {

        const resposta =
            await fetch(
                API_PRODUTOS,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        const produtos =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                produtos.error ||
                "Erro ao carregar produtos"
            );

        }


        produtosDaLoja =
            produtos.filter(
                produto =>
                    String(
                        produto.subcategoria || ""
                    )
                    .trim()
                    .toLowerCase()
                    === "cola para cílios"
            );


        lista.innerHTML = "";


        if (
            produtosDaLoja.length === 0
        ) {

            lista.innerHTML = `

                <div class="mensagem">

                    Nenhuma Cola para Cílios
                    disponível no momento. 💗

                </div>

            `;

            return;

        }


        produtosDaLoja.forEach(
            produto => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "produto";


                const id =
                    Number(produto.id);


                const preco =
                    Number(produto.preco)
                        .toFixed(2)
                        .replace(".", ",");


                div.innerHTML = `

                    ${
                        produto.imagem
                        ?
                        `
                        <img
                            src="${produto.imagem}"
                            alt="${produto.nome}"
                        >
                        `
                        :
                        ""
                    }


                    <h3>

                        👁️ ${produto.nome}

                    </h3>


                    <div
                        class="produto-preco"
                    >

                        R$ ${preco}

                    </div>


                    <div
                        class="controle-quantidade"
                    >

                        <button
                            type="button"
                            onclick="
                                alterarQuantidadeProduto(
                                    ${id},
                                    -1
                                )
                            "
                        >

                            −

                        </button>


                        <span
                            id="quantidade-${id}"
                        >

                            1

                        </span>


                        <button
                            type="button"
                            onclick="
                                alterarQuantidadeProduto(
                                    ${id},
                                    1
                                )
                            "
                        >

                            +

                        </button>

                    </div>


                    <button
                        type="button"
                        class="botao-carrinho"
                        onclick="
                            adicionarAoCarrinho(
                                ${id}
                            )
                        "
                    >

                        🛒 Adicionar ao carrinho

                    </button>

                `;


                lista.appendChild(
                    div
                );

            }
        );


    } catch (erro) {

        console.error(
            "ERRO AO CARREGAR COLAS:",
            erro
        );


        lista.innerHTML = `

            <div class="mensagem">

                Não foi possível carregar
                as Colas para Cílios. ❌

            </div>

        `;

    }

}


function alterarQuantidadeProduto(
    id,
    valor
) {

    const elemento =
        document.getElementById(
            "quantidade-" + Number(id)
        );


    if (!elemento) {

        return;

    }


    let quantidade =
        Number(
            elemento.textContent
        ) || 1;


    quantidade += valor;


    if (quantidade < 1) {

        quantidade = 1;

    }


    elemento.textContent =
        quantidade;

}


function adicionarAoCarrinho(id) {

    const produto =
        produtosDaLoja.find(
            item =>
                Number(item.id)
                === Number(id)
        );


    if (!produto) {

        alert(
            "Produto não encontrado."
        );

        return;

    }


    const elemento =
        document.getElementById(
            "quantidade-" + Number(id)
        );


    const quantidade =
        elemento
        ?
        Number(
            elemento.textContent
        ) || 1
        :
        1;


    let carrinho =
        JSON.parse(
            localStorage.getItem(
                "carrinho"
            )
        ) || [];


    const existente =
        carrinho.find(
            item =>
                Number(item.id)
                === Number(produto.id)
        );


    if (existente) {

        existente.quantidade =
            Number(
                existente.quantidade
            ) + quantidade;

    } else {

        carrinho.push({

            id:
                produto.id,

            nome:
                produto.nome,

            preco:
                Number(
                    produto.preco
                ),

            imagem:
                produto.imagem,

            categoria:
                produto.categoria,

            subcategoria:
                produto.subcategoria,

            quantidade:
                quantidade

        });

    }


    localStorage.setItem(
        "carrinho",
        JSON.stringify(
            carrinho
        )
    );


    alert(
        "💗 Produto adicionado ao carrinho!"
    );


    if (elemento) {

        elemento.textContent =
            "1";

    }

}


carregarColas();

</script>


</body>

</html>
