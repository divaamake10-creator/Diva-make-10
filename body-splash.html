<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Body Splash - Diva Make 10</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f8;
    color: #333;
}

.topo {
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    text-align: center;
    padding: 35px 10px;
    font-size: 32px;
    font-weight: bold;
}

.cabecalho {
    background: white;
    text-align: center;
    padding: 65px 20px;
}

.cabecalho h1 {
    color: #d0276b;
    font-size: 50px;
    margin-bottom: 25px;
}

.cabecalho p {
    color: #777;
    font-size: 24px;
}

.principal {
    padding: 50px 25px;
    min-height: 500px;
}

.voltar {
    display: inline-block;
    background: #cc2870;
    color: white;
    padding: 18px 40px;
    border-radius: 40px;
    text-decoration: none;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 80px;
}

.produtos-titulo {
    text-align: center;
    color: #c92b6d;
    font-size: 48px;
    margin-bottom: 50px;
}

.produto {
    background: white;
    max-width: 500px;
    margin: 0 auto;
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.produto h3 {
    color: #c92b6d;
    font-size: 32px;
    margin-bottom: 15px;
}

.preco {
    color: #d90068;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 25px;
}

.quantidade {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.quantidade button {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #ff4b9b;
    color: white;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

.quantidade span {
    font-size: 25px;
    font-weight: bold;
    min-width: 30px;
}

.adicionar {
    width: 100%;
    border: none;
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    padding: 18px;
    border-radius: 30px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.adicionar:hover {
    opacity: 0.9;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 50px 20px;
    margin-top: 30px;
}

footer h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

footer p {
    font-size: 22px;
}
</style>
</head>

<body>

<div class="topo">
    💄 DIVA MAKE 10 💗
</div>

<div class="cabecalho">

    <h1>✨ BODY SPLASH</h1>

    <p>Confira nossos Body Splash disponíveis</p>

</div>

<div class="principal">

    <a href="index.html" class="voltar">
        ← Voltar
    </a>

    <h2 class="produtos-titulo">
        ✨ Nossos Body Splash
    </h2>

    <div class="produto">

        <h3>Body Splash</h3>

        <div class="preco">
            R$ 10,00
        </div>

        <div class="quantidade">
            <button onclick="alterarQuantidade(-1)">−</button>

            <span id="quantidade">1</span>

            <button onclick="alterarQuantidade(1)">+</button>
        </div>

        <button class="adicionar" onclick="adicionarCarrinho()">
            🛒 Adicionar ao carrinho
        </button>

    </div>

</div>

<footer>

    <h2>DIVA MAKE 10 💗</h2>

    <p>
        Beleza, variedade e preço incrível!
    </p>

</footer>

<script>

let quantidade = 1;

function alterarQuantidade(valor) {

    quantidade += valor;

    if (quantidade < 1) {
        quantidade = 1;
    }

    document.getElementById("quantidade").textContent = quantidade;
}

function adicionarCarrinho() {

    const produto = {
        nome: "Body Splash",
        preco: 10,
        quantidade: quantidade
    };

    let carrinho =
        JSON.parse(localStorage.getItem("carrinho")) || [];

    const produtoExistente = carrinho.find(
        item => item.nome === produto.nome
    );

    if (produtoExistente) {

        produtoExistente.quantidade += produto.quantidade;

    } else {

        carrinho.push(produto);

    }

    localStorage.setItem(
        "carrinho",
        JSON.stringify(carrinho)
    );

    alert(
        quantidade +
        "x Body Splash foi adicionado ao carrinho! 💗"
    );
}

</script>

</body>
</html>
