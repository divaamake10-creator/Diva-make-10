<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Esfoliantes - Diva Make 10</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f8;
    color: #333;
}

.topo {
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    text-align: center;
    padding: 35px 10px;
    font-size: 32px;
    font-weight: bold;
}

.cabecalho {
    background: white;
    text-align: center;
    padding: 65px 20px;
}

.cabecalho h1 {
    color: #d0276b;
    font-size: 50px;
    margin-bottom: 25px;
}

.cabecalho p {
    color: #777;
    font-size: 24px;
}

.principal {
    padding: 50px 25px;
    min-height: 500px;
}

.voltar {
    display: inline-block;
    background: #cc2870;
    color: white;
    padding: 18px 40px;
    border-radius: 40px;
    text-decoration: none;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 80px;
}

.produtos-titulo {
    text-align: center;
    color: #c92b6d;
    font-size: 48px;
    margin-bottom: 50px;
}

.lista-produtos {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 25px;
    max-width: 1100px;
    margin: 0 auto;
}

.produto {
    background: white;
    padding: 30px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 5px 18px rgba(0,0,0,0.10);
}

.produto-imagem {
    width: 100%;
    max-width: 250px;
    height: 250px;
    object-fit: contain;
    margin: 0 auto 20px;
    display: block;
}

.produto h3 {
    color: #d0276b;
    font-size: 28px;
    margin-bottom: 20px;
}

.produto-preco {
    color: #c92b6d;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 20px;
}

.controle-quantidade {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 25px 0;
}

.controle-quantidade button {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #e52d7b;
    color: white;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}

.controle-quantidade span {
    font-size: 28px;
    font-weight: bold;
    color: #c92b6d;
    min-width: 35px;
    text-align: center;
}

.botao-carrinho {
    border: none;
    background: linear-gradient(135deg, #ff4b9b, #d90068);
    color: white;
    padding: 18px 30px;
    border-radius: 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    background: #e60073;
    color: white;
    text-align: center;
    padding: 40px 20px;
    margin-top: 30px;
}

footer h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

footer p {
    font-size: 22px;
}

@media (max-width: 700px) {

    .topo {
        font-size: 25px;
        padding: 25px 10px;
    }

    .cabecalho {
        padding: 40px 15px;
    }

    .cabecalho h1 {
        font-size: 34px;
    }

    .cabecalho p {
        font-size: 18px;
    }

    .principal {
        padding: 30px 15px;
    }

    .voltar {
        font-size: 20px;
        padding: 14px 25px;
        margin-bottom: 45px;
    }

    .produtos-titulo {
        font-size: 32px;
        margin-bottom: 30px;
    }

    .lista-produtos {
        grid-template-columns: 1fr;
    }

    .produto {
        max-width: 500px;
        margin: 0 auto;
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="topo">
    💄 DIVA MAKE 10 💗
</div>

<div class="cabecalho">

    <h1>🧴 ESFOLIANTES</h1>

    <p>Confira nossos Esfoliantes disponíveis</p>

</div>

<div class="principal">

    <a href="index.html" class="voltar">
        ← Voltar
    </a>

    <h2 class="produtos-titulo">
        🧴 Nossos Esfoliantes
    </h2>

    <div id="lista-produtos" class="lista-produtos">

        <p style="text-align:center;">
            Carregando produtos... 💗
        </p>

    </div>

</div>

<footer>

    <h2>DIVA MAKE 10 💗</h2>

    <p>
        Beleza, variedade e preço incrível!
    </p>

</footer>

<script>

const API_PRODUTOS =
    "https://diva-make-10.vercel.app/api/produtos";

let produtosDaPagina = [];

const quantidades = {};

async function carregarProdutos() {

    const lista =
        document.getElementById("lista-produtos");

    try {

        const resposta =
            await fetch(API_PRODUTOS);

        const produtos =
            await resposta.json();

        if (!resposta.ok) {
            throw new Error("Erro ao buscar produtos");
        }

        produtosDaPagina =
            produtos.filter(produto =>
                produto.subcategoria &&
                produto.subcategoria
                    .trim()
                    .toLowerCase() ===
                    "esfoliantes"
            );

        if (produtosDaPagina.length === 0) {

            lista.innerHTML = `
                <p style="
                    text-align:center;
                    font-size:22px;
                    color:#777;
                    grid-column:1/-1;
                ">
                    Nenhum esfoliante disponível no momento. 💗
                </p>
            `;

            return;
        }

        produtosDaPagina.forEach(produto => {
            quantidades[produto.id] = 1;
        });

        lista.innerHTML =
            produtosDaPagina.map(produto => {

                const imagem =
                    produto.imagem
                        ? `
                            <img
                                src="${produto.imagem}"
                                class="produto-imagem"
                                alt="${produto.nome}"
                            >
                          `
                        : "";

                return `
                    <div class="produto">

                        ${imagem}

                        <h3>
                            ${produto.nome}
                        </h3>

                        <div class="produto-preco">
                            R$ ${Number(produto.preco)
                                .toFixed(2)
                                .replace(".", ",")}
                        </div>

                        <div class="controle-quantidade">

                            <button
                                onclick="alterarQuantidade(${produto.id}, -1)">
                                −
                            </button>

                            <span id="quantidade-${produto.id}">
                                1
                            </span>

                            <button
                                onclick="alterarQuantidade(${produto.id}, 1)">
                                +
                            </button>

                        </div>

                        <button
                            class="botao-carrinho"
                            onclick="adicionarAoCarrinho(${produto.id})">
                            🛒 Adicionar ao carrinho
                        </button>

                    </div>
                `;

            }).join("");

    } catch (erro) {

        console.error(erro);

        lista.innerHTML = `
            <p style="
                text-align:center;
                color:#d0276b;
                font-size:20px;
                grid-column:1/-1;
            ">
                Não foi possível carregar os produtos. 💗
            </p>
        `;
    }
}

function alterarQuantidade(id, valor) {

    quantidades[id] =
        (quantidades[id] || 1) + valor;

    if (quantidades[id] < 1) {
        quantidades[id] = 1;
    }

    const elemento =
        document.getElementById(
            `quantidade-${id}`
        );

    if (elemento) {
        elemento.textContent =
            quantidades[id];
    }
}

function adicionarAoCarrinho(id) {

    const produto =
        produtosDaPagina.find(
            item => Number(item.id) === Number(id)
        );

    if (!produto) {
        return;
    }

    const quantidade =
        quantidades[id] || 1;

    let carrinho =
        JSON.parse(
            localStorage.getItem("carrinho")
        ) || [];

    const produtoExistente =
        carrinho.find(
            item =>
                Number(item.id) === Number(produto.id)
        );

    if (produtoExistente) {

        produtoExistente.quantidade +=
            quantidade;

    } else {

        carrinho.push({

            id: produto.id,

            nome: produto.nome,

            preco: Number(produto.preco),

            imagem: produto.imagem || "",

            categoria: produto.categoria,

            subcategoria:
                produto.subcategoria,

            quantidade: quantidade

        });

    }

    localStorage.setItem(
        "carrinho",
        JSON.stringify(carrinho)
    );

    alert(
        "💗 Produto adicionado ao carrinho!"
    );

    quantidades[id] = 1;

    const elemento =
        document.getElementById(
            `quantidade-${id}`
        );

    if (elemento) {
        elemento.textContent = 1;
    }
}

carregarProdutos();

</script>

</body>
</html>
