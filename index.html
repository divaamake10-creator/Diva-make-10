<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diva Make 10</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #fff5f8;
      color: #333;
      text-align: center;
    }

    header {
      background: #e91e63;
      color: white;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 38px;
    }

    header p {
      margin-top: 8px;
      font-size: 18px;
    }

    .destaque {
      background: #f8c8d8;
      padding: 50px 20px;
    }

    .destaque h2 {
      color: #d81b60;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .preco {
      background: #d81b60;
      color: white;
      display: inline-block;
      padding: 20px 45px;
      border-radius: 30px;
      font-size: 35px;
      font-weight: bold;
    }

    .produtos {
      padding: 50px 20px;
    }

    .produtos h2 {
      color: #d81b60;
      font-size: 30px;
      margin-bottom: 20px;
    }

    .produtos p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .botao {
      display: inline-block;
      background: #e91e63;
      color: white;
      padding: 15px 30px;
      border-radius: 25px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    footer {
      background: #e91e63;
      color: white;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>💗 Diva Make 10</h1>
    <p>Produtos de beleza por apenas R$ 10,00</p>
  </header>

  <section class="destaque">
    <h2>Beleza ao seu alcance!</h2>
    <div class="preco">R$ 10,00</div>
  </section>

  <section class="produtos">
    <h2>🛍️ Produtos</h2>
    <p>Em breve teremos produtos disponíveis 💗</p>
    <a href="#" class="botao">Confira nossas novidades</a>
  </section>

  <footer>
    <p>💗 Diva Make 10 - Produtos de beleza por apenas R$ 10,00</p>
  </footer>

</body>
</html>
