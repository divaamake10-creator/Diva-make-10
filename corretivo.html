<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corretivo - Diva Make 10</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f8;
    color: #333;
}

.topo {
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    text-align: center;
    padding: 35px 10px;
    font-size: 32px;
    font-weight: bold;
}

.cabecalho {
    background: white;
    text-align: center;
    padding: 65px 20px;
}

.cabecalho h1 {
    color: #d0276b;
    font-size: 50px;
    margin-bottom: 25px;
}

.cabecalho p {
    color: #777;
    font-size: 24px;
}

.principal {
    padding: 50px 25px;
    min-height: 500px;
}

.voltar {
    display: inline-block;
    background: #cc2870;
    color: white;
    padding: 18px 40px;
    border-radius: 40px;
    text-decoration: none;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 50px;
}

.produtos-titulo {
    text-align: center;
    color: #c92b6d;
    font-size: 48px;
    margin-bottom: 40px;
}

.produto {
    background: white;
    max-width: 500px;
    margin: 0 auto 40px;
    padding: 40px 25px;
    border-radius: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    text-align: center;
}

.produto h3 {
    color: #d0276b;
    font-size: 32px;
    margin-bottom: 20px;
}

.produto-preco {
    color: #c92b6d;
    font-size: 32px;
    font-weight: bold;
}

.controle-quantidade {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 25px 0;
}

.controle-quantidade button {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #e52d7b;
    color: white;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}

.controle-quantidade span {
    font-size: 28px;
    font-weight: bold;
    color: #c92b6d;
    min-width: 35px;
    text-align: center;
}

.botao-carrinho {
    background: linear-gradient(135deg, #ff4b9b, #d90068);
    color: white;
    border: none;
    padding: 18px 30px;
    border-radius: 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 50px 20px;
    margin-top: 30px;
}

footer h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

footer p {
    font-size: 22px;
}

</style>
</head>

<body>

<div class="topo">
    💄 DIVA MAKE 10 💗
</div>

<div class="cabecalho">

    <h1>😊 CORRETIVO</h1>

    <p>Confira nossos Corretivos disponíveis</p>

</div>

<div class="principal">

    <a href="index.html" class="voltar">
        ← Voltar
    </a>

    <h2 class="produtos-titulo">
        😊 Nossos Corretivos
    </h2>

    <div class="produto">

        <h3>😊 Corretivo</h3>

        <div class="produto-preco">
            R$ 10,00
        </div>

        <div class="controle-quantidade">

            <button onclick="alterarQuantidadeProduto(-1)">
                −
            </button>

            <span id="quantidadeProduto">
                1
            </span>

            <button onclick="alterarQuantidadeProduto(1)">
                +
            </button>

        </div>

        <button
            class="botao-carrinho"
            onclick="adicionarAoCarrinho('Corretivo', 10)"
        >
            🛒 Adicionar ao carrinho
        </button>

    </div>

</div>

<footer>

    <h2>DIVA MAKE 10 💗</h2>

    <p>
        Beleza, variedade e preço incrível!
    </p>

</footer>

<script>

let quantidadeProduto = 1;

function alterarQuantidadeProduto(valor) {

    quantidadeProduto += valor;

    if (quantidadeProduto < 1) {
        quantidadeProduto = 1;
    }

    document.getElementById("quantidadeProduto").textContent =
        quantidadeProduto;
}

function adicionarAoCarrinho(nome, preco) {

    let carrinho =
        JSON.parse(localStorage.getItem("carrinho")) || [];

    const produtoExistente =
        carrinho.find(produto => produto.nome === nome);

    if (produtoExistente) {

        produtoExistente.quantidade += quantidadeProduto;

    } else {

        carrinho.push({
            nome: nome,
            preco: preco,
            quantidade: quantidadeProduto
        });

    }

    localStorage.setItem(
        "carrinho",
        JSON.stringify(carrinho)
    );

    alert("💗 Produto adicionado ao carrinho!");

    quantidadeProduto = 1;

    document.getElementById("quantidadeProduto").textContent = 1;
}

</script>

</body>
</html>
