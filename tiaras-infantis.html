<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiaras Infantis - Diva Make 10</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f8;
    color: #333;
}

.topo {
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    text-align: center;
    padding: 35px 10px;
    font-size: 32px;
    font-weight: bold;
}

.cabecalho {
    background: white;
    text-align: center;
    padding: 65px 20px;
}

.cabecalho h1 {
    color: #d0276b;
    font-size: 50px;
    margin-bottom: 25px;
}

.cabecalho p {
    color: #777;
    font-size: 24px;
}

.principal {
    padding: 50px 25px;
    min-height: 500px;
}

.voltar {
    display: inline-block;
    background: #cc2870;
    color: white;
    padding: 18px 40px;
    border-radius: 40px;
    text-decoration: none;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 80px;
}

.produtos-titulo {
    text-align: center;
    color: #c92b6d;
    font-size: 48px;
    margin-bottom: 50px;
}

.lista-produtos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
}

.produto {
    background: white;
    padding: 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.produto img {
    width: 100%;
    max-width: 260px;
    height: 260px;
    object-fit: contain;
    border-radius: 15px;
    margin-bottom: 15px;
}

.produto h3 {
    color: #c92b6d;
    font-size: 28px;
    margin-bottom: 15px;
}

.preco {
    color: #d90068;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 20px;
}

.quantidade {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.quantidade button {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #ff4b9b;
    color: white;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

.quantidade span {
    font-size: 25px;
    font-weight: bold;
    min-width: 30px;
}

.adicionar {
    width: 100%;
    border: none;
    background: linear-gradient(90deg, #ff0080, #d90068);
    color: white;
    padding: 18px;
    border-radius: 30px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.adicionar:hover {
    opacity: 0.9;
}

.mensagem {
    text-align: center;
    font-size: 22px;
    color: #777;
    padding: 40px 10px;
}

footer {
    background: #e60073;
    color: white;
    text-align: center;
    padding: 40px 20px;
    margin-top: 30px;
}

footer h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

footer p {
    font-size: 22px;
}

@media (max-width: 600px) {

    .topo {
        font-size: 24px;
    }

    .cabecalho h1 {
        font-size: 35px;
    }

    .cabecalho p {
        font-size: 18px;
    }

    .voltar {
        font-size: 20px;
        padding: 14px 25px;
        margin-bottom: 40px;
    }

    .produtos-titulo {
        font-size: 32px;
    }

    .lista-produtos {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="topo">
    💄 DIVA MAKE 10 💗
</div>

<div class="cabecalho">

    <h1>🎀 TIARAS INFANTIS</h1>

    <p>Confira nossas Tiaras Infantis disponíveis</p>

</div>

<div class="principal">

    <a href="index.html" class="voltar">
        ← Voltar
    </a>

    <h2 class="produtos-titulo">
        🎀 Nossas Tiaras Infantis
    </h2>

    <div id="lista-produtos" class="lista-produtos">

        <p class="mensagem">
            Carregando produtos... 💗
        </p>

    </div>

</div>

<footer>

    <h2>DIVA MAKE 10 💗</h2>

    <p>
        Beleza, variedade e preço incrível!
    </p>

</footer>

<script>

const API =
    "https://diva-make-10.vercel.app/api/produtos";

let produtosDaLoja = [];

async function carregarProdutos() {

    const lista =
        document.getElementById("lista-produtos");

    try {

        const resposta =
            await fetch(API);

        if (!resposta.ok) {
            throw new Error(
                "Erro ao buscar produtos"
            );
        }

        const produtos =
            await resposta.json();

        produtosDaLoja =
            produtos.filter(produto =>
                produto.ativo !== false &&
                String(produto.subcategoria || "")
                    .trim()
                    .toLowerCase() ===
                    "tiaras infantis"
            );

        if (produtosDaLoja.length === 0) {

            lista.innerHTML = `
                <p class="mensagem">
                    Nenhuma Tiara Infantil disponível no momento. 💗
                </p>
            `;

            return;
        }

        lista.innerHTML = "";

        produtosDaLoja.forEach(produto => {

            lista.innerHTML += `
                <div class="produto">

                    ${
                        produto.imagem
                        ? `
                            <img
                                src="${produto.imagem}"
                                alt="${produto.nome}"
                            >
                          `
                        : ""
                    }

                    <h3>
                        ${produto.nome}
                    </h3>

                    <div class="preco">
                        R$ ${Number(produto.preco)
                            .toFixed(2)
                            .replace(".", ",")}
                    </div>

                    <div class="quantidade">

                        <button
                            onclick="alterarQuantidade(${produto.id}, -1)"
                        >
                            −
                        </button>

                        <span id="quantidade-${produto.id}">
                            1
                        </span>

                        <button
                            onclick="alterarQuantidade(${produto.id}, 1)"
                        >
                            +
                        </button>

                    </div>

                    <button
                        class="adicionar"
                        onclick="adicionarCarrinho(${produto.id})"
                    >
                        🛒 Adicionar ao carrinho
                    </button>

                </div>
            `;

        });

    } catch (erro) {

        console.error(erro);

        lista.innerHTML = `
            <p class="mensagem">
                Não foi possível carregar os produtos. 💗
            </p>
        `;

    }
}

function alterarQuantidade(id, valor) {

    const elemento =
        document.getElementById(
            "quantidade-" + id
        );

    let quantidade =
        Number(elemento.textContent);

    quantidade += valor;

    if (quantidade < 1) {
        quantidade = 1;
    }

    elemento.textContent =
        quantidade;
}

function adicionarCarrinho(id) {

    const produto =
        produtosDaLoja.find(
            item => Number(item.id) === Number(id)
        );

    if (!produto) {
        return;
    }

    const quantidadeElemento =
        document.getElementById(
            "quantidade-" + id
        );

    const quantidade =
        Number(quantidadeElemento.textContent);

    const itemCarrinho = {

        id: produto.id,

        nome: produto.nome,

        preco: Number(produto.preco),

        imagem: produto.imagem || "",

        categoria: produto.categoria,

        subcategoria:
            produto.subcategoria,

        quantidade:
            quantidade

    };

    let carrinho =
        JSON.parse(
            localStorage.getItem("carrinho")
        ) || [];

    const produtoExistente =
        carrinho.find(
            item =>
                Number(item.id) ===
                Number(produto.id)
        );

    if (produtoExistente) {

        produtoExistente.quantidade +=
            quantidade;

    } else {

        carrinho.push(
            itemCarrinho
        );

    }

    localStorage.setItem(
        "carrinho",
        JSON.stringify(carrinho)
    );

    alert(
        quantidade +
        "x " +
        produto.nome +
        " foi adicionada ao carrinho! 💗"
    );

}

carregarProdutos();

</script>

</body>
</html>
